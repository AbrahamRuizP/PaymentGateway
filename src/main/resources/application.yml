spring:
  application:
    name: payment-gateway

  jackson:
    default-property-inclusion: non_null
    serialization:
      writes-dates-as-timestamps: false

server:
  servlet:
    context-path: /api

springdoc:
  swagger-ui:
    path: /swagger-ui

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  level:
    root: INFO